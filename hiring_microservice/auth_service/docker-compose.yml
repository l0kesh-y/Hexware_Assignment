version: "3.9"

services:

  auth-service:
    build: .
    container_name: auth-service
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - db
    restart: always
    networks:
      - auth-network

  db:
    image: postgres:15
    container_name: auth-postgres
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auth-network

volumes:
  postgres_data:

networks:
  auth-network: